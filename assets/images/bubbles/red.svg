<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Основной круг с градиентом -->
  <radialGradient id="bubbleGradient" cx="30%" cy="30%">
    <stop offset="0%" stop-color="rgba(255, 120, 120)" />
    <stop offset="100%" stop-color="rgba(255, 0, 0, 0.7)" />
  </radialGradient>

  <circle cx="50" cy="50" r="50" fill="url(#bubbleGradient)" />

  <!-- Блики (белые овалы) -->
  <ellipse cx="65" cy="35" rx="12" ry="8" fill="white" opacity="0.1" />
  <ellipse cx="30" cy="60" rx="8" ry="6" fill="white" opacity="0.1" />

  <!-- Внутренняя тень (объём) -->
  <circle cx="50" cy="50" r="40"
          fill="none" stroke="rgba(0, 80, 200, 0.3)" stroke-width="0" />

  <!-- Лёгкая радужная кайма (имитация мыльного перелива) -->
  <circle cx="50" cy="50" r="46"
          fill="none"
          stroke-dasharray="5, 10" />
</svg>
